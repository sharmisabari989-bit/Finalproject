<!DOCTYPE html>
<html>
<head>
    <title>My Website</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        header {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 30px;
        }

        nav {
            background-color: #444;
            text-align: center;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 20px;
        }

        .container {
            width: 80%;
            margin: 40px auto;
            text-align: center;
        }

        .card {
            background-color: white;
            padding: 25px;
            margin: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px gray;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
        }

        footer {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 50px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Welcome to My Website</h1>
        <p>My First HTML Website</p>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>

    <div class="container">

        <div class="card">
            <h2>About Me</h2>
            <p>
                Hello! My name is John.
                I am learning HTML, CSS and Web Development.
            </p>
        </div>

        <div class="card">
            <h2>My Services</h2>
            <p>Web Development</p>
            <p>Cloud Computing</p>
            <p>DevOps</p>
        </div>

        <div class="card">
            <h2>Contact Me</h2>
            <p>Email: example@gmail.com</p>
            <button>Contact Me</button>
        </div>

    </div>

    <footer>
        <p>© 2026 My Website. All Rights Reserved.</p>
    </footer>

</body>
</html>
